  - numpy=2.3.2
  - matplotlib=3.10.6
  - pyparsing=3.2.3
  - jupyter=1.1.1
  - notebook=7.4.5
  - rtree=1.4.1
  - pyproj=3.7.2
  - pyshp=3.0.1
